<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daddy HUD - Live Demo</title>
    <meta name="description" content="Try Daddy HUD in your browser: body map, injuries, noise indicator, vehicle display, settings menu and edit mode." />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #05070a; }
      #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center center; overflow: hidden; }
      #stage #app { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform: translateZ(0); }
    </style>
    <script type="module" crossorigin src="./assets/index-DeGx9OpW.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-qGqjTyx1.css">
  </head>
  <body>
    <div id="stage"><div id="app"></div></div>
    <script>
      (function () {
        var stage = document.getElementById('stage')
        function fit() {
          var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080)
          stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')'
        }
        window.addEventListener('resize', fit)
        fit()
      })()
    </script>
  </body>
</html>
