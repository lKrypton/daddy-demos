<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Daddy Car Crafting - Live Demo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; }
      html { background: #07070a; }
      body { background: transparent !important; }
      body::before {
        content: ""; position: fixed; top: -20px; right: -20px; bottom: -20px; left: -20px; z-index: -2;
        background:
          radial-gradient(55% 60% at 50% 30%, rgba(212, 168, 83, .14), transparent 70%),
          radial-gradient(45% 50% at 90% 95%, rgba(212, 168, 83, .06), transparent 70%),
          linear-gradient(180deg, #121214, #07070a);
      }
      body::after {
        content: ""; position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: -1;
        background: radial-gradient(120% 90% at 50% 45%, transparent 35%, rgba(3, 3, 5, .75));
      }
      #stage { position: fixed; left: 50%; top: 50%; transform-origin: center; }
      #stage .h-screen { height: 100% !important; }
      #stage .w-screen { width: 100% !important; }
      #app { width: 100%; height: 100%; }
      .demo-tag {
        position: fixed; left: 12px; bottom: 12px; z-index: 9999; pointer-events: none;
        font: 600 11px/1 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase;
        color: rgba(255, 255, 255, .7); background: rgba(0, 0, 0, .55); padding: 7px 10px; border-radius: 999px;
      }
      .demo-tag b { color: #d4a853; }
      .demo-reopen {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 9998; cursor: pointer;
        font: 800 14px/1 'Montserrat Variable', system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase;
        color: #0a0a0c; background: linear-gradient(90deg, #d4a853, #e8c76a); border: 0; border-radius: 10px;
        padding: 18px 28px; box-shadow: 0 0 32px rgba(212, 168, 83, .3);
      }
      @media (max-width: 1200px), (max-height: 700px) { .demo-tag { display: none; } }
    </style>
    <script type="module" crossorigin src="./assets/index-B1ASRA5m.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-4bsKamt4.css">
  </head>
  <body>
    <div id="stage"><div id="app"></div></div>
    <div class="demo-tag"><b>Live demo</b> &middot; sample inventory &middot; Daddy Studios</div>
    <script>
      // Lay the UI out on at least a 1480x840 canvas and scale it down to fit small frames
      (function () {
        var stage = document.getElementById('stage')
        function fit() {
          var w = window.innerWidth, h = window.innerHeight
          var s = Math.min(1, w / 1480, h / 840)
          stage.style.width = (w / s) + 'px'
          stage.style.height = (h / s) + 'px'
          stage.style.transform = 'translate(-50%, -50%) scale(' + s + ')'
        }
        fit()
        window.addEventListener('resize', fit)
      })()
    </script>
  </body>
</html>
